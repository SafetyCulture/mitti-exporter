---
version: "3.8"
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: mitti_exporter_db
      POSTGRES_USER: mitti_exporter
      POSTGRES_PASSWORD: mitti_exporter
    ports:
      - "5434:5432"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: mitti_exporter
      MYSQL_DATABASE: mitti_exporter_db
      MYSQL_USER: mitti_exporter
      MYSQL_PASSWORD: mitti_exporter
    ports:
      - "3308:3306"

  sqlserver:
    image: mcr.microsoft.com/mssql/server
    environment:
      SA_PASSWORD: "MittiExporter12345"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - ~/docker-volume/mssql:/var/opt/mssql/data
