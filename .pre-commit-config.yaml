---
# https://pre-commit.com/
# Install pre-commit itself (once):
#   $ brew install pre-commit
# Add to your git hooks (once per repo):
#   $ pre-commit install
# Manually run all hooks (any time):
#   $ pre-commit run -a

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.4.0
    hooks:
      - id: check-json
        exclude: ^(ui/frontend/)
      - id: end-of-file-fixer
        exclude: ^(ui/frontend/)
      - id: trailing-whitespace
        exclude: ^(ui/frontend/)
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 1.11.2
    hooks:
      - id: forbid-binary
        exclude: ^(cli/docs/assets/|docs/assets/|ui/)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.20.0
    hooks:
      - id: yamllint
        args: ['-s']
        exclude: >-
          (?x)^(
            cli/pkg/api/fixtures/corrupted_configuration.yaml|
            ui/frontend/pnpm-lock.yaml
          )$
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        entry: bash -c 'cd cli && GOWORK=off golangci-lint run'
        pass_filenames: false
