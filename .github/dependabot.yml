---
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/cli"
      - "/ui"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
      exclude:
        - "sc-go.io/*"
        - "github.com/SafetyCulture/*"
  - package-ecosystem: "docker"
    directory: "/cli"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "288761735648.dkr.ecr.us-east-1.amazonaws.com/*"
      - dependency-name: "457923578311.dkr.ecr.us-east-1.amazonaws.com/*"
      - dependency-name: "303305260587.dkr.ecr.us-east-1.amazonaws.com/*"
  - package-ecosystem: "docker-compose"
    directory: "/cli"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "288761735648.dkr.ecr.us-east-1.amazonaws.com/*"
      - dependency-name: "457923578311.dkr.ecr.us-east-1.amazonaws.com/*"
      - dependency-name: "303305260587.dkr.ecr.us-east-1.amazonaws.com/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
      exclude:
        - "SafetyCulture/*"
  - package-ecosystem: "npm"
    directories:
      - "/ui/frontend"
      - "/ui/frontend/src/components/date-picker-svelte"
      - "/ui/frontend/wailsjs/runtime"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
      exclude:
        - "@safetyculture/*"
