---
version: "2"
linters:
  default: all
  disable:
    # Original disables
    - misspell  # Messes with package imports
    - funlen  # We have lots of long functions
    - gochecknoglobals  # Good practice but not always practical
    - gochecknoinits  # init functions required by cobra
    - gocognit  # We have lots of complex functions
    - godox  # We use TODO to plan longer-term fixes
    - lll  # Line-length-linter
    - wsl  # Adds unnecessary complexity
    # Linters new in golangci-lint v2 (migrated from v1 in the Go 1.25 toolchain
    # bump) — to be triaged and re-enabled incrementally, same as below
    - embeddedstructfieldcheck
    - funcorder
    - gomodguard  # deprecated in v2.12.0, replaced by gomodguard_v2
    - modernize
    - noinlineerr
    - wsl_v5  # v2 successor to wsl, which was already disabled above
    # Linters added after v1.21.0 — to be triaged and re-enabled incrementally
    - predeclared
    - bodyclose
    - canonicalheader
    - containedctx
    - cyclop
    - depguard
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct
    - fatcontext
    - forbidigo
    - forcetypeassert
    - goconst
    - gocritic
    - godot
    - gosec
    - govet
    - interfacebloat
    - ireturn
    - mirror
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - paralleltest
    - perfsprint
    - prealloc
    - recvcheck
    - revive
    - tagalign
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - whitespace
    - wrapcheck
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
